name: C++ Qt CI
on:
  push:
    branches: [main, "openai/**"]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 and build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ qt6-base-dev
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug --parallel 2
      - name: Test
        run: ctest --preset debug
